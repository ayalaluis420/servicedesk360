# Guía 10: mensajes estándar de JSF en español (message-bundle de faces-config.xml).
# {0} es la etiqueta del campo (atributo label o p:outputLabel asociado).
javax.faces.component.UIInput.REQUIRED={0}: el campo es obligatorio.
javax.faces.component.UISelectOne.INVALID={0}: la opción enviada no pertenece a la lista mostrada (valor no válido).
javax.faces.converter.LongConverter.CONVERSION={0}: el valor debe ser un número.
javax.faces.converter.LongConverter.CONVERSION_detail={0}: el valor debe ser un número.
javax.faces.validator.LengthValidator.MINIMUM={1}: debe tener al menos {0} caracteres.
javax.faces.validator.LengthValidator.MAXIMUM={1}: admite como máximo {0} caracteres.
